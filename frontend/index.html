<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#060c06" />
    <title>EcoWeb Auditor – Carbon Footprint Scanner</title>
    <meta name="description" content="Analyse the carbon footprint of any website at the element level. Free, open, and built on the Sustainable Web Design model." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      // Applied before first paint so the page never flashes the wrong theme.
      try {
        var t = localStorage.getItem("ecoweb-theme") || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
